# Production service stack for Coolify.
#
# Coolify generates every SERVICE_* value referenced below. The only optional
# user-managed values are DISABLE_SIGNUP, DISABLE_TELEMETRY, MAPBOX_TOKEN, and
# CLUSTER_WORKERS; each has a safe default except the optional Mapbox token.
#
# ClickHouse intentionally remains on the currently deployed 25.4.2 image for
# the Rybbit 2.8 application cutover. Upgrade the database engine separately so
# application and database rollback paths remain independent.

services:
  rybbit:
    image: "ghcr.io/sp3n/rybbit-client:sha-d8e86ae"
    environment:
      - SERVICE_URL_RYBBIT_3002
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${SERVICE_URL_RYBBIT}
      - NEXT_PUBLIC_DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
    depends_on:
      rybbit_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  rybbit_backend:
    image: "ghcr.io/sp3n/rybbit-backend:sha-d8e86ae"
    environment:
      - NODE_ENV=production
      - TRUST_PROXY=true
      - BASE_URL=${SERVICE_URL_RYBBIT}
      - CLICKHOUSE_HOST=http://rybbit_clickhouse:8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
      - POSTGRES_HOST=rybbit_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
      - POSTGRES_USER=${POSTGRES_USER:-frog}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - REDIS_HOST=rybbit_redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - BETTER_AUTH_SECRET=${SERVICE_BASE64_64_BACKEND}
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - DISABLE_TELEMETRY=${DISABLE_TELEMETRY:-true}
      - MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
      - CLUSTER_WORKERS=${CLUSTER_WORKERS:-4}
    depends_on:
      rybbit_clickhouse:
        condition: service_healthy
      rybbit_postgres:
        condition: service_healthy
      rybbit_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  rybbit_postgres:
    image: "postgres:17.4"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
      - POSTGRES_USER=${POSTGRES_USER:-frog}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  rybbit_clickhouse:
    image: "clickhouse/clickhouse-server:25.4.2"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-analytics}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    configs:
      - source: clickhouse_network
        target: /etc/clickhouse-server/config.d/network.xml
      - source: clickhouse_logging
        target: /etc/clickhouse-server/config.d/logging_rules.xml
      - source: clickhouse_user_settings
        target: /etc/clickhouse-server/users.d/user_settings.xml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  rybbit_redis:
    image: "redis:8.6.4-alpine"
    command:
      - redis-server
      - --requirepass
      - ${SERVICE_PASSWORD_REDIS}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SERVICE_PASSWORD_REDIS}", "--no-auth-warning", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:

configs:
  clickhouse_network:
    content: |
      <clickhouse>
        <listen_host>0.0.0.0</listen_host>
      </clickhouse>

  clickhouse_logging:
    content: |
      <clickhouse>
        <logger>
          <level>warning</level>
          <console>true</console>
        </logger>
        <query_thread_log remove="remove"/>
        <query_log remove="remove"/>
        <query_views_log remove="remove"/>
        <query_metric_log remove="remove"/>
        <error_log remove="remove"/>
        <opentelemetry_span_log remove="remove"/>
        <text_log remove="remove"/>
        <trace_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <session_log remove="remove"/>
        <part_log remove="remove"/>
        <latency_log remove="remove"/>
        <processors_profile_log remove="remove"/>
      </clickhouse>

  clickhouse_user_settings:
    content: |
      <clickhouse>
        <profiles>
          <default>
            <enable_json_type>1</enable_json_type>
            <async_insert>1</async_insert>
            <wait_for_async_insert>1</wait_for_async_insert>
            <log_queries>0</log_queries>
            <log_query_threads>0</log_query_threads>
            <log_processors_profiles>0</log_processors_profiles>
          </default>
        </profiles>
      </clickhouse>
